# Fermata 模型与流水线配置。
#
# 本文件由 src/yaml-lite.ts 里一个只支持很小子集的解析器读取，不是完整 YAML：
# 只支持 # 注释、嵌套映射、"- " 列表项和基本标量，不支持锚点、多文档、流式
# 集合、块级字符串。缩进请保持和本文件一致的两空格风格（解析器本身不强制
# 每层正好两个空格，但为了可读性，请不要混用缩进宽度）。
#
# 这里配置的是"有哪些模型档位可用"；真正生效的是 enabled/modelProfileName/
# pollingIntervalSeconds/maximumConcurrentTasks/experimentVersion 这几项运行期
# 设置，它们保存在运行期的 settings.json 里（见 src/settings-store.ts）。首次
# 启动会用下面 defaults 初始化档位/轮询/并发/版本，但 enabled 固定为 false；
# 必须由操作员通过 fermata-control 管理接口明确开启。之后可以热更新，不需要
# 重新部署。provider 只能是 aether 或 dashscope 这两种，
# 分别对应 .env 里的 AETHER_* 和 DASHSCOPE_* 变量，具体 baseUrl/apiKey 从环境
# 变量读取，不写在这个文件里。

experimentVersion: "experiment-2026-08-review-flow-historical-rubric-v1-eof-receipt-v3"

defaults:
  modelProfileName: review-balanced
  pollingIntervalSeconds: 30
  maximumConcurrentTasks: 2

# profiles 下每个 key 是一个"模型档位"的名字，供 modelProfileName 引用。
# 每个档位同时保留旧流水线与旧 11 角色槽，供历史 checkpoint 验证；新的 A/B/C/D runtime
# 从对应槽位组装四个语义请求和一个可选 formatter。`thinking` 只决定是否保留返回的推理过程。
# Aether deepseek-v4-flash 必须配置 `thinkingRequest: enabled` 与
# `reasoningEffort: max`，传输固定发送 `thinking: {type: "enabled"}` 和
# `reasoning_effort: "max"`；缺失、disabled 或非 max 都在网络前失败关闭。
#
# 下面这些具体模型名只是示例默认值，请按实际网关上可用的模型调整，不代表
# 硬性要求。
profiles:
  review-balanced:
    difficulty:
      provider: aether
      model: deepseek-v4-flash
      temperature: 0.2
      thinking: false
      thinkingRequest: enabled
      reasoningEffort: max
    thinking:
      solver:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.4
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      analyst:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: false
        thinkingRequest: enabled
        reasoningEffort: max
    coding:
      provider: aether
      model: deepseek-v4-flash
      temperature: 0.3
      thinking: false
      thinkingRequest: enabled
      reasoningEffort: max
    verdict:
      provider: aether
      model: deepseek-v4-flash
      temperature: 0.1
      thinking: false
      thinkingRequest: enabled
      reasoningEffort: max
    reviewFlow:
      solver:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.4
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      solutionAnalyst:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.2
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      technicalAuditor:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      difficulty:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.2
        thinking: false
        thinkingRequest: enabled
        reasoningEffort: max
      editorialJudge:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      contestFit:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      originality:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: false
        thinkingRequest: enabled
        reasoningEffort: max
      tags:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: false
        thinkingRequest: enabled
        reasoningEffort: max
      critic:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.2
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      adversary:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.2
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max
      adjudicator:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: true
        thinkingRequest: enabled
        reasoningEffort: max

retry:
  maxAttempts: 3
  baseDelayMs: 500

timeouts:
  # 首个事件、输出停顿和最终保护均为分阶段失效保护；持续输出按有效进度重置停顿计时。
  llmFirstOutputMs: 600000
  llmOutputIdleMs: 600000
  # 正常调用不允许回到 120 秒短总时限，也不使用 4 小时常态保护。
  llmMaximumDurationMs: 1800000
  codeforcesRequestMs: 15000

codeforces:
  minimumRequestIntervalMs: 2100

# verdict 流水线里"可配置常量"的默认值，见 src/pipelines/verdict.ts。
thresholds:
  duplicateSimilarityReject: 0.9
