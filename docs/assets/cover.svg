<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Fermata — 停下来，把题目想清楚。</title>
  <desc>深度思考 · 结构化意见 · 人工决策。原创矢量项目封面，不是产品截图。</desc>
  <defs fill="none">
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a38"/><stop offset="1" stop-color="#245269"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7be0e4" stop-opacity=".16"/><stop offset="1" stop-color="#7be0e4" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#123d49" flood-opacity=".12"/></filter>
    <g id="mark" fill="none"><path d="M9 35C9 5 55 5 55 35" stroke="#7be0e4" stroke-width="8" stroke-linecap="round"/><circle cx="32" cy="38" r="7" fill="#e8f5fa"/><path d="M10 54h44" stroke="#7be0e4" stroke-width="3" stroke-linecap="round" opacity=".45"/></g>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1000" cy="290" r="370" fill="url(#glow)"/>
  <path d="M744 0v640M0 554h1280" stroke="#e8f5fa" stroke-opacity=".09"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
    <g transform="translate(72 49) scale(.56)"><use href="#mark"/></g>
    <text x="126" y="75" fill="#e8f5fa" font-size="15" font-weight="600" letter-spacing="2.6">AN INDEPENDENT AI REVIEWER</text>
    <text x="72" y="236" fill="#e8f5fa" font-size="94" font-weight="650" letter-spacing="-4">Fermata</text>
    <text x="76" y="309" fill="#e8f5fa" font-size="35" font-weight="500">停下来，把题目想清楚。</text>
    <text x="77" y="361" fill="#e8f5fa" opacity=".75" font-size="21" letter-spacing="1.5">深度思考 · 结构化意见 · 人工决策</text>
    <g transform="translate(76 423)"><rect width="155" height="40" rx="20" fill="#102a38" fill-opacity=".62" stroke="#e8f5fa" stroke-opacity=".12"/><text x="77.5" y="26" text-anchor="middle" fill="#e8f5fa" font-size="16">AI Review</text></g>
    <g transform="translate(248 423)"><rect width="155" height="40" rx="20" fill="#102a38" fill-opacity=".62" stroke="#e8f5fa" stroke-opacity=".12"/><text x="77.5" y="26" text-anchor="middle" fill="#e8f5fa" font-size="16">JSON Schema</text></g>
    <g transform="translate(420 423)"><rect width="155" height="40" rx="20" fill="#102a38" fill-opacity=".62" stroke="#e8f5fa" stroke-opacity=".12"/><text x="77.5" y="26" text-anchor="middle" fill="#e8f5fa" font-size="16">HTTP API</text></g>
    <text x="76" y="599" fill="#e8f5fa" opacity=".7" font-size="12" letter-spacing="2">A PAUSE FOR THOUGHT. A CLEARER REVIEW.</text>
    <text x="1198" y="599" text-anchor="end" fill="#e8f5fa" opacity=".7" font-size="13">OPEN SOURCE / MIT</text>
  </g>
  <g transform="translate(848 178) rotate(12 135 142)">
    <rect x="-12" y="7" width="270" height="286" rx="40" fill="url(#glass)" stroke="#e8f5fa" stroke-opacity=".07"/>
  </g>
  <g transform="translate(833 161) rotate(-9 140 151)" filter="url(#shadow)">
    <rect width="294" height="306" rx="42" fill="url(#glass)" stroke="#fff" stroke-opacity=".65"/>
    <g transform="translate(52 50) scale(3)"><use href="#mark"/></g>
  </g>
  <g fill="#7be0e4" opacity=".45"><circle cx="1190" cy="117" r="3"/><circle cx="1186" cy="470" r="3"/><circle cx="796" cy="472" r="3"/></g>
</svg>
