# Fermata 模型与流水线配置。
#
# 本文件由 src/yaml-lite.ts 里一个只支持很小子集的解析器读取，不是完整 YAML：
# 只支持 # 注释、嵌套映射、"- " 列表项和基本标量，不支持锚点、多文档、流式
# 集合、块级字符串。缩进请保持和本文件一致的两空格风格（解析器本身不强制
# 每层正好两个空格，但为了可读性，请不要混用缩进宽度）。
#
# 这里配置的是"有哪些模型档位可用"；真正生效的是 enabled/modelProfileName/
# pollingIntervalSeconds/maximumConcurrentTasks/experimentVersion 这几项运行期
# 设置，它们保存在运行期的 settings.json 里（见 src/settings-store.ts），首次
# 启动时用下面 defaults 一节初始化，之后可以通过 fermata-control 插件的管理
# 接口热更新，不需要重新部署。provider 只能是 aether 或 dashscope 这两种，
# 分别对应 .env 里的 AETHER_* 和 DASHSCOPE_* 变量，具体 baseUrl/apiKey 从环境
# 变量读取，不写在这个文件里。

experimentVersion: "experiment-2026-08-difficulty-rubric-thinking-low-cap4096-v1"

defaults:
  modelProfileName: review-balanced
  pollingIntervalSeconds: 30
  maximumConcurrentTasks: 2

# profiles 下每个 key 是一个"模型档位"的名字，供 modelProfileName 引用。
# 每个档位为四条流水线（difficulty / thinking / coding / verdict）分别指定
# provider、model、temperature，以及是否保留模型返回的思考过程。`thinking: true`
# 只表示读取响应里的 reasoning_content，不控制模型是否进行深度思考。当前只允许
# Aether 的 deepseek-v4-flash 配置 `thinkingRequest: enabled/disabled`。enabled
# 必须同时配置 `reasoningEffort: low`，按 DeepSeek 当前 OpenAI-compatible 格式发送
# `thinking: {type: "enabled"}` 和 `reasoning_effort: "low"`；disabled 只发送
# `thinking: {type: "disabled"}`。留空时两个请求字段都不发送。thinking 流水线本身
# 分两步，所以下面有 solver 和 analyst 两个子配置。
#
# 下面这些具体模型名只是示例默认值，请按实际网关上可用的模型调整，不代表
# 硬性要求。
profiles:
  review-balanced:
    difficulty:
      provider: aether
      model: deepseek-v4-flash
      temperature: 0.2
      thinking: false
      thinkingRequest: enabled
      reasoningEffort: low
    thinking:
      solver:
        provider: aether
        model: deepseek-v4-pro
        temperature: 0.4
        thinking: true
      analyst:
        provider: aether
        model: deepseek-v4-flash
        temperature: 0.1
        thinking: false
    coding:
      provider: aether
      model: deepseek-v4-flash
      temperature: 0.3
      thinking: false
    verdict:
      provider: aether
      model: deepseek-v4-pro
      temperature: 0.1
      thinking: false

retry:
  maxAttempts: 3
  baseDelayMs: 500

timeouts:
  # 等待第一段模型输出。深度思考可能较久，因此不能设成短时限。
  llmFirstOutputMs: 1800000
  # 收到首个有效模型事件后，允许连续没有新有效内容的时间。
  llmOutputIdleMs: 600000
  # 只保护首个有效事件前的阶段（包括 429 等待）；有效输出开始后不是总时限。
  llmMaximumDurationMs: 14400000
  codeforcesRequestMs: 15000

codeforces:
  minimumRequestIntervalMs: 2100

# verdict 流水线里"可配置常量"的默认值，见 src/pipelines/verdict.ts。
thresholds:
  duplicateSimilarityReject: 0.9
